name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-packages/liturgos-auditor-stt/pyproject.toml
      - name: Install
        working-directory: python-packages/liturgos-auditor-stt
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: python-packages/liturgos-auditor-stt
        run: python -m pytest -q
