[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditor-stt"
version = "0.1.0"
description = "Liturgos Auditor self-hosted speech-to-text inference service (faster-whisper) and dataset pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jsilvanus" }
]
keywords = ["speech-to-text", "whisper", "faster-whisper", "transcription", "captions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # 1.2 is the series verified for array input, initial_prompt, hotwords,
    # vad_filter and clip_timestamps (saarnavideo pins the same floor).
    "faster-whisper>=1.2",
    # Imported directly by the batch-job audio code (jobs/wav.py, jobs/chunking.py).
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Dataset build pulls in pandas/pyarrow, so it stays out of the serving image.
dataset = [
    "datasets>=2.19",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "datasets>=2.19",
]
training = [
    "datasets>=2.19",
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
    "peft>=0.10",
]

[project.scripts]
auditor-stt = "auditor_stt.cli:main"

[project.urls]
Homepage = "https://github.com/jsilvanus/liturgos-auditor"
Repository = "https://github.com/jsilvanus/liturgos-auditor"
Issues = "https://github.com/jsilvanus/liturgos-auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["auditor_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: end-to-end mechanics smoke tests that download model weights (set AUDITOR_STT_RUN_SLOW=1)",
]
