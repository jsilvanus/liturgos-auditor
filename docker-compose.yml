services:
  auditor-stt:
    build:
      context: ./python-packages/liturgos-auditor-stt
      dockerfile: ../../docker/liturgos-auditor-stt/Dockerfile
    ports:
      - "${AUDITOR_STT_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      # Use faster-whisper's built-in model alias so the model source stays valid.
      AUDITOR_STT_MODEL: ${AUDITOR_STT_MODEL:-large-v3-turbo}
      AUDITOR_STT_MODEL_DIR: /models
      AUDITOR_STT_DEVICE: ${AUDITOR_STT_DEVICE:-cpu}
      AUDITOR_STT_DEFAULT_LANGUAGE: ${AUDITOR_STT_DEFAULT_LANGUAGE:-fi}
      AUDITOR_STT_DATA_DIR: /data
      AUDITOR_STT_JOB_TTL_HOURS: ${AUDITOR_STT_JOB_TTL_HOURS:-72}
      AUDITOR_STT_MAX_UPLOAD_MB: ${AUDITOR_STT_MAX_UPLOAD_MB:-2048}
      AUDITOR_STT_API_KEY: ${AUDITOR_STT_API_KEY:-}
      # Promoted fine-tuned models live in the same volume as downloaded ones, so they survive restarts.
      # Switching models at runtime (POST /model) additionally requires AUDITOR_STT_API_KEY to be set.
      AUDITOR_STT_REGISTRY_DIR: /models/registry
      AUDITOR_STT_ALLOWED_MODELS: ${AUDITOR_STT_ALLOWED_MODELS:-}
      AUDITOR_STT_MAX_QUEUE: ${AUDITOR_STT_MAX_QUEUE:-8}
      AUDITOR_STT_CARRY_CONTEXT_CHARS: ${AUDITOR_STT_CARRY_CONTEXT_CHARS:-200}
      AUDITOR_STT_BATCH_VAD: ${AUDITOR_STT_BATCH_VAD:-1}
      AUDITOR_STT_MAX_LIVE_UPLOAD_MB: ${AUDITOR_STT_MAX_LIVE_UPLOAD_MB:-64}
      # To enable media root (read-only shared media directory), uncomment below:
      # AUDITOR_STT_MEDIA_ROOT: /media
    volumes:
      # The image runs as uid/gid 10001, not root. A volume created by this image starts out owned by
      # 10001. Volumes created by an older, root-running image stay root-owned and need a one-time
      # chown before the service can write to them: see "Upgrading an existing deployment" in
      # docker/liturgos-auditor-stt/README.md.
      - auditor-stt-models:/models
      - auditor-stt-data:/data
      # Uncomment below to mount a shared media directory (read-only):
      # - ${AUDITOR_STT_MEDIA_HOST_DIR}:/media:ro
    # Hardening on top of the non-root user. no-new-privileges stops a compromised process from
    # gaining privileges through a setuid binary; cap_drop ALL removes every Linux capability (the
    # service binds port 8090 and writes to its own volumes, so it needs none). Not read_only: the
    # service writes temp files (uploads, normalised audio) under /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  auditor-stt-models:
  auditor-stt-data:
